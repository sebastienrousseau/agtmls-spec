name: release

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without creating a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: tag the specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A specification release that breaks a conformant implementation is the
      # one thing this repository must never ship. Nothing is tagged until
      # every implementation still passes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls
          path: .agtmls
          ref: feat/v0.0.6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-core
          path: .agtmls-core
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - run: python3 -m unittest discover -s tests
      - run: ./conformance/validate-corpus.py
      - name: Every implementation still conforms
        run: |
          cargo build --release -p agtmls-cli --manifest-path .agtmls-core/Cargo.toml
          ./conformance/run.py --python .agtmls --rust .agtmls-core/target/release/agtmls-rs

      - name: Tag must match the spec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          DECLARED=$(grep -oE 'spec_version[^0-9]*([0-9]+\.[0-9]+\.[0-9]+)' spec/07-conformance.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test "v${DECLARED}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared spec version ${DECLARED}"
            exit 1
          }

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "agtmls-spec ${GITHUB_REF_NAME}" --generate-notes
