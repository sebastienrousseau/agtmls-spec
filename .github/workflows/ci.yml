name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The spec is only as good as the implementations that pass it, so this
  # repository's CI tests OTHER repositories. A spec change that breaks a
  # conformant implementation must fail here, not there.
  implementations:
    name: every implementation still conforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls
          path: .agtmls
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-core
          path: .agtmls-core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build the Rust implementation
        run: cargo build --release -p agtmls-cli --manifest-path .agtmls-core/Cargo.toml
      - name: Differential conformance
        run: |
          ./conformance/run.py \
            --python .agtmls \
            --rust .agtmls-core/target/release/agtmls-rs

  corpus-integrity:
    name: corpus is well-formed (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and ceiling the reference implementation supports: the
        # corpus must parse on both, or it is not portable.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: ./conformance/validate-corpus.py
      - run: ./conformance/validate-signatures.py
      - run: ./conformance/validate-attestations.py
      - run: ./conformance/validate-advisories.py
      - run: python3 -m unittest discover -s tests

  signatures:
    name: commits are signed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          git config gpg.ssh.allowedSignersFile KEYS.asc
          unsigned=0
          # --no-merges: on a pull_request event HEAD is the synthetic merge
          # commit GitHub creates, which no contributor signs.
          for commit in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            author=$(git log -1 --format='%an' "$commit")
            # A bot's commits are signed by GitHub's key, not by a maintainer
            # key in KEYS.asc, so they verify as E here. That is a different
            # trust path -- authenticated by the forge, not by us -- and this
            # gate governs contributor commits. Excluding them is deliberate;
            # a human commit pushed to a bot's branch is still checked.
            case "$author" in
              *"[bot]") echo "skipping bot commit $commit ($author)"; continue ;;
            esac
            status=$(git log -1 --format='%G?' "$commit")
            if [ "$status" != "G" ] && [ "$status" != "U" ]; then
              echo "::error::unsigned or unverifiable commit $commit (%G? = $status)"
              unsigned=1
            fi
          done
          test "$unsigned" -eq 0
