#
# Rules are data, not code: every implementation loads this same file, so
# adding a rule never means writing the same pattern twice in two languages.

id = "AGT-INJ-006"
category = "prompt_injection"
severity = "high"
title = "DAN exploit phrase"
scope = "normalised"
applies_to = ["*.md", "*.txt", "executable"]

description = '''DAN exploit pattern ('do anything now')'''
rationale = '''The 'do anything now' trigger phrase.'''

# (?i) is inline, not a host-language compile flag: the flag would not
# survive export and the two implementations would disagree on case.
# scope = "normalised": Matched against the whitespace-normalised document so a payload split across a newline cannot evade it.
pattern = '''(?i)\bdo\s+anything\s+now\b'''

[[true_positive]]
text = '''You can do anything now.'''

# No false_positive is declared, deliberately — same reasoning as AGT-INJ-001.
#
# The only candidate is prose *about* the phrase. Excluding it needs negation
# detection, and negation detection is inverted by writing the payload as a
# prohibition. A security rule should prefer the false positive here; the
# escape hatch is a digest-keyed suppression, which is reviewable and scoped.
false_positive_policy = "none-acceptable"
